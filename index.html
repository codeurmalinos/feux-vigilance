<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Feux France</title>

<!-- Home screen shortcut support (iOS + Android) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feux France">
<meta name="theme-color" content="#14110f">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314110f'/%3E%3Cpath d='M50 12c8 14-4 18-4 28 0 8 6 12 12 12 8 0 14-6 14-14 0-6-3-10-3-10s10 8 10 24c0 18-15 32-32 32S15 70 15 56c0-20 14-24 18-38 2 8 5 10 8 8-3-6-1-14 9-14z' fill='%23e8622c'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
  // Set the theme before first paint (avoids a flash of the wrong theme).
  (function(){
    var saved = null;
    try { saved = localStorage.getItem('feuxTheme'); } catch(e){}
    var resolved = saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', resolved);
  })();
</script>

<style>
  :root{
    /* Light palette (default) — tuned for outdoor / direct-sunlight readability */
    --bg: #f2ede4;
    --panel: #ffffff;
    --panel-border: #ddd2bd;
    --ember: #d9480f;
    --ember-dim: #b8390c;
    --text: #201a12;
    --text-dim: #5b5042;
    --ok: #2f7d3c;
    --shadow: 0 6px 20px rgba(40,30,15,0.15);
  }
  :root[data-theme="dark"]{
    --bg: #14110f;
    --panel: #1d1815;
    --panel-border: #3a2f22;
    --ember: #ff7a3d;
    --ember-dim: #c2551f;
    --text: #fbf6ee;
    --text-dim: #cdbfae;
    --ok: #7fce68;
    --shadow: 0 6px 24px rgba(0,0,0,0.45);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); overflow:hidden; }
  body{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  #map{ position:fixed; inset:0; background:#0c0a09; }

  /* Only the basemap tiles get darkened/desaturated — never the fire overlay,
     otherwise the hotspots become invisible (this was the original bug). */
  .basemap-tile{ filter: saturate(0.8) brightness(0.92) contrast(1.04); }
  /* CARTO's dark tiles are already tuned for legibility (land/sea/border contrast) —
     the previous brightness(0.6) crushed that contrast to near-black. Only a light touch now. */
  :root[data-theme="dark"] .basemap-tile{ filter: saturate(0.95) contrast(1.08); }
  /* Satellite imagery already reads clearly — skip the darkening filter so land/sea/relief stay legible */
  .basemap-tile.satellite{ filter: saturate(1.05) brightness(0.97) contrast(1.05) !important; }
  /* Small glow on the fire pixels so isolated hotspots don't get lost against either theme */
  .fire-tile{ filter: saturate(1.5) contrast(1.25) drop-shadow(0 0 2px rgba(255,90,20,0.9)); }

  .leaflet-control-zoom{ display:none; } /* pinch-to-zoom only, keeps it uncluttered */

  /* Top bar */
  #topbar{
    position:fixed; top:0; left:0; right:0;
    padding: max(10px, env(safe-area-inset-top)) 12px 10px 12px;
    display:flex; align-items:center; justify-content:space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
    z-index:1000; pointer-events:none;
  }
  #topbar > *{ pointer-events:auto; }
  #brand{ display:flex; align-items:baseline; gap:8px; }
  #brand .dot{
    width:8px; height:8px; border-radius:50%; background:var(--ember);
    box-shadow: 0 0 8px 2px rgba(232,98,44,0.7);
    display:inline-block; animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  #brand h1{ font-size:15px; font-weight:700; color:#fff; margin:0; letter-spacing:.2px; text-shadow:0 1px 3px rgba(0,0,0,0.5); }
  #status{ font-size:10.5px; color:#e8e0d4; margin-top:1px; text-shadow:0 1px 3px rgba(0,0,0,0.5); }

  .roundBtn{
    background: var(--panel); border:1px solid var(--panel-border); color:var(--text);
    width:38px; height:38px; border-radius:12px; font-size:16px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
  }
  #topbarBtns{ display:flex; gap:8px; }
  #refreshBtn.spin svg{ animation: spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Slim, always-visible attribution strip at the very bottom — replaces
     Leaflet's own attribution control so nothing ever overlaps it. */
  #sourcesBar{
    position:fixed; left:0; right:0; bottom:0; z-index:1000;
    padding: 4px 54px 4px 10px;
    padding-bottom: max(4px, env(safe-area-inset-bottom));
    font-size:9.5px; line-height:1.3; text-align:center;
    color:#e8e0d4; background:rgba(0,0,0,0.55);
    pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* Compact floating controls, bottom-right only — never spans the full width */
  #dockRight{
    position:fixed; right:12px; z-index:1001;
    bottom: calc(max(12px, env(safe-area-inset-bottom)) + 26px);
    display:flex; flex-direction:column; align-items:flex-end; gap:10px;
    pointer-events:none;
  }
  #dockRight > *{ pointer-events:auto; }
  #fabStack{ display:flex; flex-direction:column; gap:10px; }
  .fab{
    width:46px; height:46px; border-radius:50%; flex:0 0 auto;
    background: var(--panel); border:1px solid var(--panel-border); color:var(--text);
    font-size:18px; display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
  }
  .fab:active{ filter:brightness(0.95); }
  .fab.primary{ background: var(--ember); border-color: var(--ember); color:#fff8f0; }
  .fab.active{ background: rgba(232,98,44,0.16); border-color: var(--ember-dim); color: var(--ember); }
  .fab.busy{ animation: pulse 1s ease-in-out infinite; }
  .fab:disabled{ opacity:.6; }

  /* Layers popover — opens above the FAB stack, never covers it */
  #layersSheet{
    display:none; flex-direction:column; gap:12px;
    width: min(78vw, 280px);
    background: var(--panel); border:1px solid var(--panel-border); border-radius:16px;
    padding:14px; box-shadow: var(--shadow);
  }
  #layersSheet.open{ display:flex; }
  .sheetLabel{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); margin-bottom:6px; }
  .segmented{ display:flex; background:rgba(128,110,80,0.12); border-radius:10px; padding:3px; gap:3px; }
  .segBtn{
    flex:1; border:none; background:transparent; color:var(--text-dim);
    font-size:12px; font-weight:600; padding:7px 6px; border-radius:8px;
  }
  .segBtn.active{ background: var(--ember); color:#fff8f0; }
  .sheetRow{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); }
  .sheetToggle{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text); margin-top:8px; }
  .sheetToggle input{ width:16px; height:16px; accent-color: var(--ember); flex:0 0 auto; }
  .sw{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }

  /* First-run helper toast */
  #hint{
    position:fixed; left:12px; right:12px; top: max(56px, calc(env(safe-area-inset-top) + 50px));
    background: var(--panel); border:1px solid var(--panel-border); color:var(--text-dim);
    font-size:11.5px; line-height:1.4; padding:10px 12px; border-radius:12px; z-index:999;
    box-shadow: var(--shadow);
  }
  #hint b{ color:var(--text); }
  #hint button{
    margin-top:6px; background:none; border:none; color:var(--ember); font-size:11.5px; font-weight:700; padding:0;
  }

  .leaflet-popup-content-wrapper{ background:var(--panel); color:var(--text); border-radius:12px; }
  .leaflet-popup-tip{ background:var(--panel); }
  .leaflet-popup-content{ font-size:12px; margin:10px 12px; }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <div id="brand">
    <div>
      <h1><span class="dot"></span> Feux France</h1>
      <div id="status">Chargement…</div>
    </div>
  </div>
  <div id="topbarBtns">
    <button class="roundBtn" id="themeBtn" aria-label="Changer de thème">🌙</button>
    <button class="roundBtn" id="refreshBtn" aria-label="Actualiser">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
    </button>
  </div>
</div>

<div id="hint">
  <b>Astuce :</b> ajoute cette page à ton écran d'accueil (menu du navigateur → « Sur l'écran d'accueil ») pour l'ouvrir comme une appli, en un geste.
  <br><button id="hintClose">Compris</button>
</div>

<div id="dockRight">
  <div id="layersSheet">
    <div>
      <div class="sheetLabel">Fond de carte</div>
      <div class="segmented" id="basemapSeg">
        <button class="segBtn active" data-basemap="map">Carte</button>
        <button class="segBtn" data-basemap="satellite">Satellite</button>
      </div>
    </div>
    <div>
      <div class="sheetLabel">Détection incendies</div>
      <div class="sheetRow"><span class="sw" style="background:#ff5a1a"></span> VIIRS 375 m — toujours actif</div>
      <label class="sheetToggle">
        <input type="checkbox" id="chipModis">
        <span class="sw" style="background:#ffb238"></span> + historique large (MODIS 1 km)
      </label>
    </div>
    <div>
      <div class="sheetLabel">Période</div>
      <div class="segmented" id="daySeg">
        <button class="segBtn active" data-day="today">Aujourd'hui</button>
        <button class="segBtn" data-day="yesterday">Hier</button>
      </div>
    </div>
  </div>

  <div id="fabStack">
    <button class="fab" id="locateBtn" title="Ma position" aria-label="Ma position">📍</button>
    <button class="fab" id="layersBtn" title="Calques" aria-label="Calques">🗂️</button>
    <button class="fab primary" id="franceBtn" title="Recentrer France" aria-label="Recentrer France">🇫🇷</button>
  </div>
</div>

<div id="sourcesBar"></div>

<script>
(function(){
  // ---- Theme handling ----
  var themeBtn = document.getElementById('themeBtn');
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('feuxTheme'); } catch(e){}
  var state = { day: 'today', showModis: false, cacheBust: Date.now(),
                basemap: 'map' /* 'map' | 'satellite' */,
                theme: savedTheme /* 'light' | 'dark' | null (= follow system) */ };

  function systemPrefersDark(){ return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
  function resolvedTheme(){ return state.theme || (systemPrefersDark() ? 'dark' : 'light'); }
  function applyThemeUI(){
    document.documentElement.setAttribute('data-theme', resolvedTheme());
    themeBtn.textContent = resolvedTheme() === 'dark' ? '☀️' : '🌙';
  }
  applyThemeUI();
  themeBtn.addEventListener('click', function(){
    state.theme = resolvedTheme() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('feuxTheme', state.theme); } catch(e){}
    applyThemeUI();
    rebuildLayers();
  });

  // ---- Map setup, centered on metropolitan France ----
  var map = L.map('map', {
    zoomControl: false,
    attributionControl: false, // custom #sourcesBar replaces it — see updateSourcesBar()
    minZoom: 4,
    maxZoom: 17,
    worldCopyJump: true
  }).setView([46.6, 2.4], 6);

  var FRANCE_VIEW = { center: [46.6, 2.4], zoom: 6 };

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function isoDate(d){ return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()); }
  function todayUTC(){ return new Date(); }
  function yesterdayUTC(){ var d = new Date(); d.setUTCDate(d.getUTCDate()-1); return d; }
  function currentDate(){ return state.day === 'today' ? todayUTC() : yesterdayUTC(); }

  var baseLayer, viirsLayer, modisLayer;
  var loadGeneration = 0; // see rebuildLayers() — guards the slow-source timer against stale rebuilds

  // ---- Basemap: plain raster tiles, no fire data involved ----
  var ATTR_MAP = '© OpenStreetMap, © CARTO';
  var ATTR_SATELLITE = 'Esri, Maxar, Earthstar Geographics';

  function buildBasemap(){
    if (state.basemap === 'satellite'){
      return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        className: 'basemap-tile satellite'
      });
    }
    var dark = resolvedTheme() === 'dark';
    return L.tileLayer('https://{s}.basemaps.cartocdn.com/' + (dark ? 'dark_all' : 'light_all') + '/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 20,
      className: 'basemap-tile'
    });
  }

  // Custom attribution strip (replaces Leaflet's control — see attributionControl:false above)
  function updateSourcesBar(){
    var basemapAttr = state.basemap === 'satellite' ? ATTR_SATELLITE : ATTR_MAP;
    document.getElementById('sourcesBar').textContent = 'NASA FIRMS/GIBS · ' + basemapAttr;
  }

  // ---- Fire hotspots: NASA GIBS WMS (server-side rendering) ----
  // Important: GIBS also *advertises* these fire layers as WMTS vector tiles
  // (.mvt), but those are only published in EPSG:4326/EPSG:3413 — NOT Web
  // Mercator — so they 404 against a normal {z}/{x}/{y} Leaflet/slippy map
  // and appear as "no fires at all". The WMS endpoint reprojects server-side
  // and returns plain PNG tiles in EPSG:3857, which is what we want here.
  var GIBS_WMS = 'https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi';
  var VIIRS_LAYERS = 'VIIRS_SNPP_Thermal_Anomalies_375m_All,VIIRS_NOAA20_Thermal_Anomalies_375m_All,VIIRS_NOAA21_Thermal_Anomalies_375m_All';
  var MODIS_LAYERS = 'MODIS_Combined_Thermal_Anomalies_All';

  function fireLayer(layers, opacity){
    return L.tileLayer.wms(GIBS_WMS, {
      layers: layers,
      format: 'image/png',
      transparent: true,
      version: '1.3.0',
      time: isoDate(currentDate()),
      v: state.cacheBust, // harmless extra param, busts caches on manual refresh
      opacity: opacity,
      maxZoom: 17,
      className: 'fire-tile',
      attribution: 'NASA FIRMS/GIBS'
    });
  }

  function rebuildLayers(){
    [baseLayer, viirsLayer, modisLayer].forEach(function(l){ if (l && map.hasLayer(l)) map.removeLayer(l); });

    baseLayer = buildBasemap().addTo(map);
    baseLayer.bringToBack();
    updateSourcesBar();

    viirsLayer = fireLayer(VIIRS_LAYERS, 1).addTo(map);
    if (state.showModis){
      modisLayer = fireLayer(MODIS_LAYERS, 0.85).addTo(map);
    } else {
      modisLayer = null;
    }

    // The NASA GIBS server that supplies fire hotspots can get very slow under
    // heavy load (observed 5–35s+ per tile during a wildfire-season traffic spike),
    // with no error — just silence. Without this, the status bar sits on "Mise à
    // jour…" indefinitely and the site looks broken. `loadGeneration` guards against
    // a stale timer firing after the user has already switched day/basemap/etc.
    var myGeneration = ++loadGeneration;
    setStatus('Chargement des données de feux…');
    var slowTimer = setTimeout(function(){
      if (myGeneration === loadGeneration) setStatus('Le service NASA (FIRMS) répond lentement aujourd'hui — patiente, ça va arriver…');
    }, 6000);

    var loaded = 0, errored = 0, layers = [viirsLayer, modisLayer].filter(Boolean);
    function done(){
      loaded++;
      if (loaded >= layers.length){
        clearTimeout(slowTimer);
        if (myGeneration !== loadGeneration) return; // superseded by a newer rebuild
        var prefix = errored > 0 ? 'Connexion instable · ' : 'À jour · ';
        var note = state.day === 'today' ? ' · couverture partielle, se complète dans la journée' : '';
        setStatus(prefix + dateLabel() + ' · ' + nowLabel() + note);
      }
    }
    layers.forEach(function(l){
      l.on('load', done);
      l.on('tileerror', function(){ errored++; });
    });
  }

  function nowLabel(){
    return new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  }
  function dateLabel(){
    return currentDate().toLocaleDateString('fr-FR', { day:'numeric', month:'long', timeZone:'UTC' });
  }
  function setStatus(txt){ document.getElementById('status').textContent = txt; }

  rebuildLayers();

  // ---- UI wiring ----

  // Generic helper for the two segmented controls (basemap / day): clicking a
  // button activates it, deactivates its siblings, and applies the change.
  function wireSegmented(containerId, dataAttr, onChange){
    var container = document.getElementById(containerId);
    container.addEventListener('click', function(e){
      var btn = e.target.closest('.segBtn');
      if (!btn || btn.classList.contains('active')) return;
      container.querySelectorAll('.segBtn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      onChange(btn.getAttribute(dataAttr));
    });
  }

  wireSegmented('basemapSeg', 'data-basemap', function(value){
    state.basemap = value;
    rebuildLayers();
  });
  wireSegmented('daySeg', 'data-day', function(value){
    state.day = value;
    setStatus('Mise à jour…');
    rebuildLayers();
  });

  document.getElementById('chipModis').addEventListener('change', function(e){
    state.showModis = e.target.checked;
    setStatus('Mise à jour…');
    rebuildLayers();
  });

  // ---- Layers popover: opened from the FAB, closed by tapping it again or the map ----
  var layersBtn = document.getElementById('layersBtn');
  var layersSheet = document.getElementById('layersSheet');
  layersBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = layersSheet.classList.toggle('open');
    layersBtn.classList.toggle('active', open);
  });
  map.on('click', function(){
    if (layersSheet.classList.contains('open')){
      layersSheet.classList.remove('open');
      layersBtn.classList.remove('active');
    }
  });

  var refreshBtn = document.getElementById('refreshBtn');
  function doRefresh(){
    refreshBtn.classList.add('spin');
    state.cacheBust = Date.now();
    setStatus('Actualisation…');
    rebuildLayers();
    setTimeout(function(){ refreshBtn.classList.remove('spin'); }, 800);
  }
  refreshBtn.addEventListener('click', doRefresh);

  document.getElementById('franceBtn').addEventListener('click', function(){
    map.setView(FRANCE_VIEW.center, FRANCE_VIEW.zoom);
  });

  // ---- Geolocation ----
  var meMarker;
  var locateBtn = document.getElementById('locateBtn');
  locateBtn.addEventListener('click', function(){
    if (!('geolocation' in navigator)){
      alert("La géolocalisation n'est pas disponible sur cet appareil ou ce navigateur.");
      return;
    }
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
      alert("La géolocalisation nécessite une connexion sécurisée (https). Ouvre la page via son adresse https:// pour l'utiliser.");
      return;
    }
    locateBtn.disabled = true;
    locateBtn.classList.add('busy');
    navigator.geolocation.getCurrentPosition(function(pos){
      var ll = [pos.coords.latitude, pos.coords.longitude];
      if (meMarker) map.removeLayer(meMarker);
      meMarker = L.circleMarker(ll, { radius:8, color:'#fff', weight:3, fillColor:'#4fa8ff', fillOpacity:0.9 }).addTo(map);
      map.setView(ll, 10);
      locateBtn.disabled = false;
      locateBtn.classList.remove('busy');
    }, function(err){
      locateBtn.disabled = false;
      locateBtn.classList.remove('busy');
      var msg = "Impossible d'obtenir ta position.";
      if (err.code === err.PERMISSION_DENIED) msg = "Localisation refusée. Autorise l'accès à la position pour ce site dans les réglages du navigateur, puis réessaie.";
      else if (err.code === err.POSITION_UNAVAILABLE) msg = "Position indisponible pour le moment (GPS/réseau). Réessaie dans un instant.";
      else if (err.code === err.TIMEOUT) msg = "La recherche de position a expiré. Réessaie, idéalement en extérieur ou près d'une fenêtre.";
      alert(msg);
    }, { enableHighAccuracy:true, timeout:15000, maximumAge:60000 });
  });

  document.getElementById('hintClose').addEventListener('click', function(){
    document.getElementById('hint').style.display = 'none';
  });
  setTimeout(function(){ var h = document.getElementById('hint'); if (h) h.style.display = 'none'; }, 9000);

  // React to the device switching light/dark while the page is open (only if the
  // user hasn't manually forced a theme via the toggle button).
  if (window.matchMedia){
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
      if (!state.theme){ applyThemeUI(); rebuildLayers(); }
    });
  }

  // Keep the map sized correctly through mobile browser UI show/hide.
  window.addEventListener('resize', function(){ map.invalidateSize(); });

  // Auto-refresh every 10 minutes
  setInterval(doRefresh, 10 * 60 * 1000);

  setStatus('Chargement…');
})();
</script>
</body>
</html>
